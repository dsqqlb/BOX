<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <!-- top face -->
  <polygon points="50,8 88,28 62,44 24,24" fill="url(#top)"/>
  <!-- right face -->
  <polygon points="88,28 88,72 62,88 62,44" fill="url(#side)"/>
  <!-- front face -->
  <polygon points="24,24 62,44 62,88 24,68" fill="url(#front)"/>
  <!-- "B" letter on front face -->
  <text x="43" y="64" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#e0e7ff" text-anchor="middle">B</text>
</svg>
