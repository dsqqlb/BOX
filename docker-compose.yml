services:
  # 前端：Next.js 静态导出产物，由 nginx 托管
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 留空即可：运行时会自动用访问者当前的hostname拼WebSocket地址。
        # 只有当你想固定用某个域名/反代地址时才需要在 .env 里设置 NEXT_PUBLIC_WS_URL 并取消下面的注释。
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    image: box-web:latest
    container_name: box-web
    restart: unless-stopped
    ports:
      - "9999:80"
    volumes:
      # 挂载图片目录：以后加塔罗牌图/怪物图片直接放进这个宿主机文件夹即可生效，
      # 不需要重新build镜像（nginx直接从磁盘读文件）
      - ./public/image:/usr/share/nginx/html/image:ro
    depends_on:
      - ws-server

  # WebSocket服务：房间实时同步 + /enemies 怪物图片清单接口
  ws-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: box-ws-server:latest
    container_name: box-ws-server
    restart: unless-stopped
    ports:
      - "9998:9998"
    volumes:
      # 和前端共享同一份图片目录（只读），/enemies 接口会实时扫描这里的怪物图片子目录
      - ./public/image:/public/image:ro
    environment:
      - WS_PORT=9998
