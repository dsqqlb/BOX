server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩，静态站点体积不小（json-visualizer打包后258KB+图片资源）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Next.js静态导出(output: 'export')产物是 /tools/xxx/index.html 这种目录形式，
    # 优先匹配精确文件，其次尝试补 .html 后缀，最后尝试目录下的 index.html，找不到才是真的404
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # WebSocket反代：把 /ws 开头的请求转发给 ws-server 容器（房间同步 + /enemies + /player-images 接口）。
    # 这样公网只需要暴露nginx这一个端口（如Cloudflare Tunnel场景），不需要单独为WebSocket开一条隧道规则。
    # rewrite规则去掉/ws前缀，让路径在到达ws-server时和本地直连时保持一致（/、/enemies、/player-images）。
    location /ws {
        rewrite ^/ws$ / break;
        rewrite ^/ws/(.*)$ /$1 break;

        proxy_pass http://ws-server:9998;
        proxy_http_version 1.1;

        # WebSocket升级所必需的头；对普通HTTP请求（如/ws/enemies）这些头不会造成任何影响
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket是长连接，默认60s的读超时会把空闲连接强制断开，调大避免误杀
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态资源（图片/字体/JS/CSS）长期缓存；public/image 目录是挂载的volume，
    # 加新图片后浏览器强刷或清缓存即可看到，不需要重启nginx
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|otf|ttf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}
