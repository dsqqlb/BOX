server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩，静态站点体积不小（json-visualizer打包后258KB+图片资源）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Next.js静态导出(output: 'export')产物是 /tools/xxx/index.html 这种目录形式，
    # 优先匹配精确文件，其次尝试补 .html 后缀，最后尝试目录下的 index.html，找不到才是真的404
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # 静态资源（图片/字体/JS/CSS）长期缓存；public/image 目录是挂载的volume，
    # 加新图片后浏览器强刷或清缓存即可看到，不需要重启nginx
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|otf|ttf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}
